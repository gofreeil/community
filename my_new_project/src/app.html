<!doctype html>
<html lang="he" dir="rtl">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" type="image/png" href="/favicon.png" />
		<link rel="apple-touch-icon" href="/favicon.png" />
		<link rel="shortcut icon" href="/favicon.ico" />
		<!-- פתיחת חיבור מוקדמת לשרת אריחי המפה (OSM) - חוסך DNS/TLS בטעינת האריח הראשון -->
		<link rel="preconnect" href="https://tile.openstreetmap.org" crossorigin />
		<!-- פונט Assistant נטען כאן (ולא ב-@import בתוך app.css) כדי לשבור את
		     שרשרת החסימה HTML→CSS→פונט: הדפדפן מגלה את הפונט מיד עם ה-HTML -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700&display=swap" />
		<!-- תגי Open Graph + title נקבעים פר-דף ב-<svelte:head> כדי שלא יתנגשו עם תוכן דינמי -->
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
