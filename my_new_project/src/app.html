<!doctype html>
<html lang="he" dir="rtl">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" type="image/png" href="/favicon.png" />
		<link rel="apple-touch-icon" href="/favicon.png" />
		<link rel="shortcut icon" href="/favicon.ico" />
		<!-- פתיחת חיבור מוקדמת לשרת אריחי המפה (OSM) - חוסך DNS/TLS בטעינת האריח הראשון -->
		<link rel="preconnect" href="https://tile.openstreetmap.org" crossorigin />
		<!-- גופן האתר (Heebo) מתארח אצלנו ומוגדר ב-@font-face שב-app.css.
		     אין link/preconnect לגוגל: אין בקשה חוסמת-רינדור לשרת חיצוני -->
		<!-- תגי Open Graph + title נקבעים פר-דף ב-<svelte:head> כדי שלא יתנגשו עם תוכן דינמי -->
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
